<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>7000單「一字多義」分週背誦與抽考測驗（212筆）</title>
<style>
  :root{
    --bg:#0f2027; --bg2:#203a43; --bg3:#2c5364;
    --card:#ffffff; --ink:#1d2b36; --muted:#6b7d8a;
    --brand:#1e6f9f; --brand-d:#155b84;
    --ok:#2e9e5b; --ok-bg:#e7f7ed; --bad:#d34b4b; --bad-bg:#fbe9e9;
    --line:#e2e8ee;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2),var(--bg3));
    color:var(--ink); min-height:100vh; font-size:16px; line-height:1.6;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px; margin:0 auto; padding:18px 0 90px;}
  header{color:#fff; text-align:center; margin-bottom:14px;}
  header h1{font-size:22px; margin:0 0 4px;}
  header .sub{opacity:.85; font-size:13px;}
  .panel{background:var(--card); border-radius:16px; padding:20px; box-shadow:0 8px 28px rgba(0,0,0,.25); margin-bottom:14px;}
  .scope{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .chip{flex:1 1 calc(33.33% - 6px); min-width:130px; border:2px solid var(--line); border-radius:12px;
    padding:10px 8px; text-align:center; cursor:pointer; user-select:none; transition:.15s; background:#fff;}
  .chip .n{font-size:12px; color:var(--muted);}
  .chip .t{font-weight:700; font-size:15px;}
  .chip.on{border-color:var(--brand); background:#eaf4fb; color:var(--brand-d);}
  .chip.done{border-color:#86efac;}
  .chip.curr{border-color:#f59e0b;}
  .modes{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .modes .chip{flex:1; min-width:120px;}
  label.h{font-size:13px; color:var(--muted); display:block; margin:14px 0 4px; font-weight:600;}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn{flex:1; min-width:180px; border:none; border-radius:14px; padding:14px;
    font-size:16px; font-weight:700; cursor:pointer; transition:.15s; font-family:inherit; text-align:center;}
  .btn-go{background:var(--brand); color:#fff;}
  .btn-mock{background:#d97706; color:#fff;}
  .btn-study{background:#0f766e; color:#fff;}
  .btn-ghost{background:#eef3f7; color:var(--brand-d); margin-top:10px; width:100%;}
  .qbar{display:flex; justify-content:space-between; align-items:center; color:#fff; font-size:13px; margin-bottom:8px;}
  .prog{height:6px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; margin-bottom:14px;}
  .prog>i{display:block; height:100%; background:#7fd1ff; width:0; transition:.3s;}
  .tag{display:inline-block; font-size:12px; background:#eaf4fb; color:var(--brand-d);
    padding:3px 10px; border-radius:99px; margin-bottom:10px; font-weight:700;}
  .qtext{font-size:20px; font-weight:700; margin:0 0 6px;}
  .qex{font-size:15px; color:#334155; background:#f8fafc; border-left:4px solid var(--brand); padding:8px 12px; border-radius:6px; margin-bottom:16px;}
  .opt{display:flex; align-items:flex-start; gap:10px; border:2px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer; transition:.12s; background:#fff;}
  .opt .k{font-weight:800; color:var(--brand); min-width:20px;}
  .opt.sel{border-color:var(--brand); background:#eaf4fb;}
  .opt.correct{border-color:var(--ok); background:var(--ok-bg);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .feedback{border-radius:12px; padding:13px 15px; margin-top:6px; font-size:15px; display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--ok-bg); color:#1d6e3f;}
  .feedback.bad{background:var(--bad-bg); color:#9e2f2f;}
  .nav{position:fixed; left:0; right:0; bottom:0; background:rgba(15,32,39,.92);
    backdrop-filter:blur(6px); padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .nav .row{max-width:720px; margin:0 auto; display:flex; gap:10px;}
  .nav button{flex:1; border:none; border-radius:12px; padding:13px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer;}
  .nav .sec{background:#3a5a6b; color:#fff;}
  .nav .pri{background:var(--brand); color:#fff;}
  .nav button:disabled{opacity:.4;}
  .score{text-align:center;}
  .score .big{font-size:52px; font-weight:800; color:var(--brand);}
  .review h3{font-size:16px; border-left:4px solid var(--brand); padding-left:8px;}
  .ritem{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; font-size:14px;}
  .hide{display:none;}
  .small{font-size:12px; color:var(--muted); text-align:center; margin-top:12px;}
  table{width:100%; border-collapse:collapse; font-size:14px; margin-top:10px;}
  th,td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;}
  th{background:#f1f5f9;}
  .search{width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; font-size:15px; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>7000單「一字多義」分週背誦與抽考測驗</h1>
    <div class="sub">Joe 英文每週 30 字作業（共 212 筆）｜已考完 1–60・本週進度 61–90</div>
  </header>

  <div id="home" class="panel">
    <label class="h">選擇週次範圍（可複選，點選切換）</label>
    <div class="scope" id="scope"></div>

    <label class="h">作答模式</label>
    <div class="modes">
      <div class="chip on" data-mode="instant"><div class="t">練習模式</div><div class="n">作答後立刻看解析</div></div>
      <div class="chip" data-mode="exam"><div class="t">測驗模式</div><div class="n">答完公布成績</div></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-mock" id="startMock">⚡ 模擬上課抽考（隨機 3 題）</button>
      <button class="btn btn-go" id="startAll">📝 完整測驗所選範圍</button>
      <button class="btn btn-study" id="showStudy">📖 背誦表／遮罩記憶</button>
    </div>
    <button class="btn btn-ghost hide" id="wrongOnly">只練我的錯題（<span id="wrongCount">0</span>）</button>
    <div class="small" id="homeNote"></div>
  </div>

  <div id="study" class="panel hide">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <h3 style="margin:0;">📖 一字多義背誦表（所選範圍）</h3>
      <div>
        <button onclick="toggleMask()" style="padding:7px 12px;border-radius:8px;border:1px solid var(--brand);background:#eaf4fb;color:var(--brand-d);font-weight:700;cursor:pointer;">👁️ 切換遮住中譯</button>
        <button onclick="closeStudy()" style="padding:7px 12px;border-radius:8px;border:none;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;">返回測驗首頁</button>
      </div>
    </div>
    <input type="text" id="searchBox" class="search" placeholder="搜尋英文單字、中文義項或搭配例..." oninput="renderStudyTable()">
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th style="width:48px">#</th><th style="width:120px">單字 / 級數</th><th>非基本義（點擊單格可翻開）</th><th>搭配例與中譯</th></tr></thead>
        <tbody id="studyBody"></tbody>
      </table>
    </div>
  </div>

  <div id="quiz" class="hide">
    <div class="qbar"><span id="qpos"></span><span id="qscope"></span></div>
    <div class="prog"><i id="progbar"></i></div>
    <div class="panel">
      <span class="tag" id="qtag">單選題</span>
      <div class="qtext" id="qtext"></div>
      <div class="qex" id="qex"></div>
      <div id="opts"></div>
      <div class="feedback" id="fb"></div>
    </div>
  </div>

  <div id="result" class="panel hide">
    <div class="score">
      <div class="lbl">本次得分</div>
      <div class="big" id="rScore">100</div>
      <div class="lbl">答對 <b id="rRight">0</b> ／ 共 <b id="rTotal">0</b> 題</div>
    </div>
    <button class="btn btn-go" style="width:100%;margin-top:14px;" id="again">再考一次相同範圍</button>
    <button class="btn btn-mock" style="width:100%;margin-top:10px;" id="againMock">⚡ 再隨機抽考 3 題</button>
    <button class="btn btn-ghost" id="retryWrong">只重考本次錯題</button>
    <button class="btn btn-ghost" id="backHome">回範圍選擇</button>
    <div class="review" id="reviewBox"></div>
  </div>
</div>

<div class="nav hide" id="nav">
  <div class="row">
    <button class="sec" id=" exitBtn" onclick="backToHome()">回首頁</button>
    <button class="sec" id="prev">上一題</button>
    <button class="pri" id="next">送出答案</button>
  </div>
</div>

  { id:"w1", name:"第 1 週 (1–30)", status:"✅ 1031全對" },
  { id:"w2", name:"第 2 週 (31–60)", status:"✅ 1108全對" },

  { id:"w4", name:"第 4 週 (91–120)", status:"待背" },
  { id:"w5", name:"第 5 週 (121–150)", status:"待背" },
  { id:"w6", name:"第 6 週 (151–180)", status:"待背" },
  { id:"w7", name:"第 7 週 (181–212)", status:"待背" }
];

const $ = s => document.querySelector(s);
const LS_WRONG = "quiz_joe_poly212_v1";
let selChapters = new Set(["w3"]);
let mode = "instant";
let quiz = [], idx = 0, answers = [], locked = [];
let masked = false;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuestion(item){
  const others = shuffle(RAW.filter(x=>x.id!==item.id && x.mean!==item.mean)).slice(0,3).map(x=>x.mean);
  const opts = shuffle([item.mean, ...others]);
  const ans = [opts.indexOf(item.mean)];
  return {
    id: item.id,
    ch: item.wk,
    topic: `編號 #${item.id} ｜ ${item.word} (${item.pos})`,
    q: `#${item.id}　${item.word}（${item.pos}）的非基本義為何？`,
    ex: `搭配例：${item.exEn}`,
    options: opts,
    answer: ans,
    exp: `${item.word}（${item.pos}）：「${item.mean}」｜例：${item.exEn}（${item.exZh}）`
  };
}

function loadWrong(){ try{return JSON.parse(localStorage.getItem(LS_WRONG))||[]}catch(e){return[]} }
function saveWrong(list){ localStorage.setItem(LS_WRONG, JSON.stringify(list)); }
function addWrong(id){ let w=loadWrong(); if(!w.includes(id)){ w.push(id); saveWrong(w); } }
function removeWrong(id){ saveWrong(loadWrong().filter(x=>x!==id)); }

function renderHome(){
  const box = $("#scope"); box.innerHTML="";
  CH.forEach(c=>{
    const n = RAW.filter(b=>b.wk===c.id).length;
    const el = document.createElement("div");
    el.className = "chip" + (selChapters.has(c.id)?" on":"");
    el.innerHTML = `<div class="t">${c.name}</div><div class="n">${c.status}・${n} 筆</div>`;
    el.onclick = ()=>{ selChapters.has(c.id)?selChapters.delete(c.id):selChapters.add(c.id);
      if(selChapters.size===0) selChapters.add(c.id); renderHome(); };
    box.appendChild(el);
  });
  const wc = loadWrong().length;
  $("#wrongCount").textContent = wc;
  $("#wrongOnly").classList.toggle("hide", wc===0);
  const total = RAW.filter(b=>selChapters.has(b.wk)).length;
  $("#homeNote").textContent = `目前已勾選 ${total} 筆單字（可點選上方週次自由組合）`;
}

document.querySelectorAll(".modes .chip").forEach(c=>{
  c.onclick = ()=>{ document.querySelectorAll(".modes .chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); mode = c.dataset.mode; };
});

function startQuiz(rawPool, limit=0){
  let list = shuffle(rawPool);
  if(limit>0) list = list.slice(0, limit);
  quiz = list.map(buildQuestion);
  idx = 0; answers = quiz.map(()=>[]); locked = quiz.map(()=>false);
  $("#home").classList.add("hide"); $("#study").classList.add("hide"); $("#result").classList.add("hide");
  $("#quiz").classList.remove("hide"); $("#nav").classList.remove("hide");
  renderQ();
}

$("#startMock").onclick = ()=> startQuiz(RAW.filter(b=>selChapters.has(b.wk)), 3);
$("#startAll").onclick = ()=> startQuiz(RAW.filter(b=>selChapters.has(b.wk)), 0);
$("#wrongOnly").onclick = ()=>{
  const w = loadWrong(); const pool = RAW.filter(b=>w.includes(b.id));
  if(pool.length===0){ alert("目前沒有錯題！"); return; }
  startQuiz(pool, 0);
};

$("#showStudy").onclick = ()=>{
  $("#home").classList.add("hide"); $("#study").classList.remove("hide");
  renderStudyTable();
};
function closeStudy(){ $("#study").classList.add("hide"); $("#home").classList.remove("hide"); }
function toggleMask(){ masked = !masked; renderStudyTable(); }
function renderStudyTable(){
  const q = ($("#searchBox").value||"").trim().toLowerCase();
  const rows = RAW.filter(b=>selChapters.has(b.wk) && (!q || b.word.toLowerCase().includes(q) || b.mean.includes(q) || b.exEn.toLowerCase().includes(q) || b.exZh.includes(q)));
  const tb = $("#studyBody"); tb.innerHTML="";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    const mStyle = masked ? "color:transparent;background:#e2e8f0;border-radius:4px;cursor:pointer;user-select:none;" : "";
    tr.innerHTML = `<td>${r.id}</td>
      <td><b>${r.word}</b><br><span style="font-size:12px;color:#64748b">${r.pos}</span></td>
      <td style="${mStyle}" onclick="this.style.color='inherit';this.style.background='transparent'">${r.mean}</td>
      <td><div><b>${r.exEn}</b></div><div style="${mStyle};font-size:13px;color:${masked?'transparent':'#475569'}" onclick="this.style.color='#475569';this.style.background='transparent'">${r.exZh}</div></td>`;
    tb.appendChild(tr);
  });
}

function backToHome(){
  $("#quiz").classList.add("hide"); $("#nav").classList.add("hide"); $("#result").classList.add("hide");
  $("#home").classList.remove("hide"); renderHome();
}

function renderQ(){
  const item = quiz[idx];
  $("#qpos").textContent = `第 ${idx+1} / ${quiz.length} 題`;
  $("#qscope").textContent = item.topic||"";
  $("#progbar").style.width = ((idx)/quiz.length*100)+"%";
  $("#qtext").textContent = item.q;
  $("#qex").textContent = item.ex;

  const opts = $("#opts"); opts.innerHTML="";
  const keys = ["A","B","C","D"];
  item.options.forEach((o,i)=>{
    const el = document.createElement("div");
    el.className = "opt";
    el.innerHTML = `<span class="k">${keys[i]}</span><span>${o}</span>`;
    if(answers[idx].includes(i)) el.classList.add("sel");
    if(locked[idx]){
      if(item.answer.includes(i)) el.classList.add("correct");
      else if(answers[idx].includes(i)) el.classList.add("wrong");
    } else { el.onclick = ()=>{ answers[idx]=[i]; renderQ(); }; }
    opts.appendChild(el);
  });

  const fb = $("#fb");
  if(locked[idx]){
    const correct = answers[idx][0] === item.answer[0];
    fb.className = "feedback show " + (correct?"ok":"bad");
    fb.innerHTML = `<b>${correct?"✅ 答對了":"❌ 答錯了"}</b>${item.exp}`;
  } else { fb.className="feedback"; fb.innerHTML=""; }

  $("#prev").disabled = idx===0;
  const lastQ = idx===quiz.length-1;
  $("#next").textContent = (mode==="instant" && !locked[idx]) ? "送出答案" : (lastQ ? "看成績" : "下一題");
}

$("#next").onclick = ()=>{
  const item = quiz[idx];
  if(mode==="instant" && !locked[idx]){
    if(answers[idx].length===0){ alert("請先選擇一個選項"); return; }
    locked[idx]=true;
    if(answers[idx][0]===item.answer[0]) removeWrong(item.id); else addWrong(item.id);
    renderQ(); return;
  }
  if(idx===quiz.length-1){ finish(); } else { idx++; renderQ(); }
};
$("#prev").onclick = ()=>{ if(idx>0){ idx--; renderQ(); } };

function finish(){
  let right=0;
  quiz.forEach((item,i)=>{
    const ok = answers[i][0]===item.answer[0];
    if(ok){ right++; if(mode==="exam") removeWrong(item.id); }
    else if(mode==="exam") addWrong(item.id);
  });
  const total = quiz.length;
  $("#quiz").classList.add("hide"); $("#nav").classList.add("hide");
  $("#result").classList.remove("hide");
  $("#rScore").textContent = Math.round(right/total*100);
  $("#rRight").textContent = right; $("#rTotal").textContent = total;

  const box = $("#reviewBox"); const keys=["A","B","C","D"];
  const wrongItems = quiz.map((item,i)=>({item,i})).filter(x=>answers[x.i][0]!==x.item.answer[0]);
  if(wrongItems.length===0){ box.innerHTML = "<h3>🎉 全部答對，太強了！</h3>"; }
  else{
    box.innerHTML = `<h3>錯題檢討（${wrongItems.length} 題）</h3>`;
    wrongItems.forEach(({item,i})=>{
      const yours = answers[i].length? item.options[answers[i][0]] : "未作答";
      const el = document.createElement("div"); el.className="ritem";
      el.innerHTML = `<div style="font-weight:700">${item.q}</div>
        <div style="color:#d34b4b">你的答案：${yours}</div>
        <div style="color:#2e9e5b">正解：${item.options[item.answer[0]]}</div>
        <div style="color:#6b7d8a;margin-top:4px">${item.exp}</div>`;
      box.appendChild(el);
    });
  }
}

$("#again").onclick = ()=> startQuiz(RAW.filter(b=>quiz.some(q=>q.id===b.id)), 0);
$("#againMock").onclick = ()=> startQuiz(RAW.filter(b=>selChapters.has(b.wk)), 3);
$("#retryWrong").onclick = ()=>{
  const wrongIds = quiz.filter((item,i)=>answers[i][0]!==item.answer[0]).map(x=>x.id);
  if(wrongIds.length===0){ alert("這次沒有錯題！"); return; }
  startQuiz(RAW.filter(b=>wrongIds.includes(b.id)), 0);
};
$("#backHome").onclick = backToHome;

renderHome();
</script>
</body>
